<?xml version="1.0" encoding="UTF-8"?>
<!-- Alpine Faction settings chrome: menu_cap_tall - af_menu_cap for the stock-height menu button: the same steel end cap, LED and brackets, authored 143 tall instead of 78. Four 72x143 states stacked 151 apart: arrow, arrow lit, plain, plain lit. Sheet is 72x596. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 596" width="72" height="596">
  <defs>
    <linearGradient id="mct-steelv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e4e8"/>
      <stop offset="0.4" stop-color="#b0b0b6"/>
      <stop offset="1" stop-color="#76767e"/>
    </linearGradient>
    <linearGradient id="mct-steelh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a90"/>
