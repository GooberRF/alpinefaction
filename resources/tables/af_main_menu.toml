# The level behind the menus when Options > Interface > Menu background is "Live level".
# The menus show the Mars background instead if the level fails to load.
#
# [live_level_normal] is the usual level. [live_level_seasonal] replaces it during the winter season.
# Without a usable seasonal level the normal one runs.
#
# The level runs as in single player, with no player and no sound. Each shot holds a fixed camera for shot_seconds
# (at least 1), in this file's order, and dips to black for fade_seconds at each end.
# pos: camera position [x, y, z], in meters; it must be inside the level and out of any liquid.
# pitch: degrees, positive looks down. heading: degrees, 0 looks along +Z and 90 along +X.

[live_level_normal]
level = "L3S1.rfl"
berserk = false
shot_seconds = 12.0
fade_seconds = 1.0

