"l12s1_hen_03.wav" = "Parker, Orion says Eos was planning to bring a computer disk to Ultor's Communications Center."
"l12s1_hen_04.wav" = "Eos had contacts in the Earth Defense Force. She thought they'd send a rescue fleet if we put out a distress call."
"l12s1_hen_05.wav" = "The message and transmission codes are on the disk. All you have to do is get it to a communications console."
"l12s1_hen_06.wav" = "The Comm Center's at the end of this canyon. Let's deal with the canyon first, then look for a way up to the Comm Center."
"l12s1_hen_07.wav" = "Somewhere down there is a natural tunnel that Ultor used as an outflow pipe for the sewage system."
"l12s1_hen_08.wav" = "That's the only way up from the canyon floor."
"l12s1_hen_10.wav" = "It was blocked by a landslide about six months ago, but Ultor cleared it off."
"l12s1_min_01.wav" = "Are you Parker? Eos said that if she didn't come out, you would."
"l12s1_min_02.wav" = "She said to give you this computer disk. I dunno why."
"l12s1_min_03.wav" = "We need to go to the far end of the canyon."
"l12s1_min_04.wav" = "I'll drive. You hop in back and man the gun."
"l12s1_min_05.wav" = "It was rough getting here, and I don't expect it'll be any easier getting back."
"l12s1_min_06.wav" = "Keep them off us or we'll never make it through!"
"l12s2_hen_01.wav" = "Still no word from Eos. I don't think she made it."
"l12s2_hen_03.wav" = "First Eos is lost, and now Ultor's sent in reinforcements."
"l12s2_hen_04.wav" = "They've kept a regiment of mercenaries in reserve. Now they're coming out."
"l12s2_hen_05.wav" = "The mercs are led by Colonel Masako, a real nasty piece of work."
"l12s2_hen_06.wav" = "They're all butchers, and she's the worst of them."
"l12s2_hen_08.wav" = "Got some more bad news for you, Parker."
"l12s2_hen_09.wav" = "Orion still hasn't heard from Eos, but that's not the really bad news."
"l12s2_hen_10.wav" = "Once you've sent the message from the Comm Center, we still have to get the fleet in here."
"l12s2_hen_11.wav" = "Ultor has a system of laser satellites orbiting Mars. They'll tear the fleet apart unless we disable them somehow."
"l12s2_hen_13.wav" = "There's a space station that controls the satellites. We've got to get you up there."
"l12s2_hen_15.wav" = "But let's get that message out first."
"l12s2_tech_01.wav" = "I don't know how much longer I can deal with this crap."
"l12s2_tech_02.wav" = "Hey, I'd rather be down here where it's quiet than up top where all hell's breaking loose."
"l12s2_tech_03.wav" = "I guess, but it really stinks down here."
"l12s2_tech_04.wav" = "In a couple more months, you won't even notice."
"l12s2_tech_05.wav" = "That's what I'm afraid of."
"l12s2_tech_06.wav" = "Hey, I've been down here for years, and it hasn't affected me none."
"l12s2_tech_07.wav" = "I notice you don't get invited to a lot of parties...."
"l12s2_tech_08.wav" = "Yeah, yeah. Get back to work, wiseass."
"l13s1_hen_01.wav" = "You're in, Parker. Now for the hard part."
