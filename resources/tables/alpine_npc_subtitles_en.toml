"training_ps2_01_inst_01.wav" = "OK, Parker, this is the training phase of your Red Faction probationary period."
"training_ps2_01_inst_02.wav" = "If you survive, you'll be ready to help lead the miner rebellion against Ultor, when the time comes."
"training_ps2_01_inst_03.wav" = "Some doors open as you approach."
"training_ps2_01_inst_04.wav" = "Others, like this airlock door, require you to press a button to open."
"training_ps2_01_inst_05.wav" = "If the button doesn't work, the door's locked. You'll have to find the access card or control to unlock it."
"training_ps2_01_inst_06.wav" = "Keep an eye on your suit's gauges, which are in the upper left corner of your HUD. The outer ring is your suit's integrity. If it gets to zero, you suffer damage when you're outside."
"training_ps2_01_inst_07.wav" = "Practice climbing on the fence, girders, and ladder in your envirosuit."
"training_ps2_01_inst_08.wav" = "When you're done, climb up the ladder and go through the door."
"training_ps2_01_inst_09.wav" = "Get used to that sound. You'll hear alarms a lot once we strike back at Ultor."
"training_ps2_01_inst_10.wav" = "Step into the security control room to learn how to use a monitor."
"training_ps2_01_inst_11.wav" = "Monitors let you see through security cameras in other locations. So we can turn Ultor's surveillance systems against them."
"training_ps2_01_inst_12.wav" = "Pretend the barrels are guards and take them out with this turret."
"training_ps2_01_inst_13.wav" = "If you've been injured or your suit's been damaged, check containers, medical cabinets, and lockers for medpacks and suit repair kits."
"training_ps2_01_inst_14.wav" = "If you ever need to hide a body, pick it up, carry it somewhere out of the way, and dump it."
"training_ps2_01_inst_15.wav" = "Looks like this door is broken. Crouch to get underneath it."
"training_ps2_01_inst_16.wav" = "Practice jumping across this small gap."
"training_ps2_01_inst_17.wav" = "Nothing more to shoot here, Parker. Keep moving."
"training_ps2_01_inst_18.wav" = "This gap is wider. Get a running start and don't jump until you're right at the edge."
"training_ps2_01_inst_19.wav" = "There's a medic in the room to your right. Medics are sworn to heal anyone, even rebels."
"training_ps2_01_inst_20.wav" = "Go to the medic and he'll bandage your wounds."
"training_ps2_01_inst_21.wav" = "Hey! If you destroy the cameras, I can't see you and I'll have a hard time helping you through training."
"training_ps2_01_inst_22.wav" = "You need to learn how to use security monitors before progressing to the next training stage."
"training_ps2_01_inst_23.wav" = "You have to destroy all the barrels to advance to the next section of training."
"training_ps2_01_inst_24.wav" = "You need to let the medic heal you before moving on to the next section of training."
"training_ps2_01_inst_25.wav" = "You must dump the body in the storage room before you can advance to the next training stage."
"training_ps2_01_inst_26.wav" = "You need to open some of the containers before you can progress to the next section of training."
"training_ps2_01_inst_27.wav" = "If those barrels were guards, you'd be dead. Move along to the next area."
"training_ps2_01_inst_28.wav" = "The inner ring is your health. When it gets to zero, you're dead."
"training_ps2_02_inst_01.wav" = "Ask nicely, and the miner will open the door for you."
"training_ps2_02_inst_02.wav" = "Like the sub? We stole it from Ultor."
"training_ps2_02_inst_03.wav" = "Climb in and take it for a ride, in case you have to drive a vehicle after we launch the revolt."
"training_ps2_02_inst_04.wav" = "Fire some torpedoes to get a feel for it."
