# Subtitles for spoken voice lines.
#
# Keys are wav filenames as they appear in the packfile; lookup lowercases both
# sides, so case here does not matter. A line with no entry has no subtitle.
#
# Level dialogue is the text the game already ships in its L*S*_text.tbl files -
# it is authored, not transcribed, but nothing ever puts it on screen. Ambient NPC
# barks have no text anywhere, so those were transcribed from the audio and are the
# lines most likely to contain a mistake.

