name: CI

on:
  push:
    paths-ignore: &paths
      - '**.md'
  pull_request:
    paths-ignore: *paths
  workflow_dispatch:

permissions: {}

env:
  BUILD_TYPE: Release
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  build-gnu:
    runs-on: ubuntu-24.04
    # GCC 14 MinGW required for C++23 deducing-this (game_patch targets cxx_std_23).
    # Use mirror.gcr.io to avoid Docker Hub rate limits on shared GitHub runners.
    container:
      image: mirror.gcr.io/library/debian:trixie
    env:
      # d3dcompiler_43.dll is used only as a build tool under Wine - it is never packed into
      # alpinefaction.vpp or staged as an artifact, so nothing here is redistributed.
      DIRECTX_REDIST_URL: https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe
      D3DCOMPILER_43_SHA256: 2f23182ec6f4889397ac4bf03d62536136c5bdba825c7d2c4ef08c827f3a8a1c

    steps:
    - uses: actions/checkout@v6
    - uses: mozilla-actions/sccache-action@v0.0.10

    - name: Install packages
      run: |
        dpkg --add-architecture i386
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          g++-mingw-w64-i686-posix ninja-build wine32 wine cmake ca-certificates \
          cabextract curl

    - name: Cache Microsoft D3DCompiler
      id: d3dcompiler-cache
      uses: actions/cache@v4
      with:
        path: .d3dcompiler
        key: d3dcompiler_43-directx-jun2010

    # shader_compiler.exe runs under Wine and links d3dcompiler_43. Wine's builtin d3dcompiler
    # forwards to vkd3d-shader, which ignores the optimization flags and flattens all control
    # flow - the resulting shaders come out ~20x larger and need far more temporary registers
    # than drivers accept, so the game dies in fatal_gr_error on level load. Extract the real
    # Microsoft DLL out of the DirectX June 2010 redistributable instead.
    - name: Fetch Microsoft D3DCompiler
      if: steps.d3dcompiler-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/directx_redist.exe" "$DIRECTX_REDIST_URL"
        # The redist also bundles D3DCompiler_42 and the x64 builds, so name the cab exactly.
        # Both -F patterns use the archive's own spelling, and the results are looked up with
        # -iname, so neither cabextract's case folding nor -L has to behave a particular way.
        cabextract -d "$tmp" -L -F 'Jun2010_D3DCompiler_43_x86.cab' "$tmp/directx_redist.exe"
        inner="$(find "$tmp" -maxdepth 1 -iname 'Jun2010_D3DCompiler_43_x86.cab' -print -quit)"
        if [ -z "$inner" ]; then
          echo '[ERROR] Jun2010_D3DCompiler_43_x86.cab not found in the DirectX redistributable'
          exit 1
        fi
        cabextract -d "$tmp/dll" -L -F 'D3DCompiler_43.dll' "$inner"
        dll="$(find "$tmp/dll" -maxdepth 1 -iname 'd3dcompiler_43.dll' -print -quit)"
        if [ -z "$dll" ]; then
          echo '[ERROR] d3dcompiler_43.dll not found in Jun2010_D3DCompiler_43_x86.cab'
          exit 1
        fi
        mkdir -p .d3dcompiler
        cp "$dll" .d3dcompiler/d3dcompiler_43.dll

    - name: Set up Wine prefix
      run: |
        set -euo pipefail
        # Runs on the cached path too, so a stale or corrupted cache entry is caught as well.
        echo "$D3DCOMPILER_43_SHA256  .d3dcompiler/d3dcompiler_43.dll" | sha256sum -c -
        export WINEPREFIX=$GITHUB_WORKSPACE/.wine
        export WINEARCH=win32
        export WINEDEBUG=-all
        wineboot --init
        wineserver -w
        cp .d3dcompiler/d3dcompiler_43.dll "$WINEPREFIX/drive_c/windows/system32/"

    - name: Create a build environment
      run: cmake -E make_directory ./build

    - name: Configure CMake
      working-directory: ./build
      run: |
        cmake .. \
          -G Ninja \
          -D CMAKE_C_COMPILER_LAUNCHER=sccache \
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -D CMAKE_BUILD_TYPE=$BUILD_TYPE \
          -D CMAKE_TOOLCHAIN_FILE=../cmake/mingw-ubuntu.cmake

    - name: Build
      working-directory: ./build
      run: |
        export WINEPREFIX=$GITHUB_WORKSPACE/.wine
        export WINEARCH=win32
        export WINEDEBUG=-all
        export WINEDLLOVERRIDES=d3dcompiler_43=n
        cmake --build . -j $(nproc)

    - name: Stage artifacts
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/dist/gnu"
        mkdir -p "$out"

        want=(AlpineFaction.dll AlpineEditor.dll AlpineFactionLauncher.exe CrashHandler.exe d3d8to9.dll alpinefaction.vpp)

        for f in "${want[@]}"; do
          src="$(find "$GITHUB_WORKSPACE/build" -type f -name "$f" -print -quit || true)"
          if [ -z "$src" ]; then
            echo "[ERROR] Missing $f (not found under build/)"
            echo 'Dumping likely output dirs:'
            find "$GITHUB_WORKSPACE/build" -maxdepth 3 -type d -print
            exit 1
          fi
          cp -f "$src" "$out/$f"
        done

        echo 'Staged:'
        ls -la "$out"

    - name: Upload artifacts (GNU)
      uses: actions/upload-artifact@v6
      with:
        name: alpinefaction-gnu
        path: dist/gnu/**
        if-no-files-found: error
        retention-days: 14

  build-msvc:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6
    - uses: mozilla-actions/sccache-action@v0.0.10

    - name: Add VS_INSTALL and VS_TOOLS to GITHUB_ENV
      run: |
        $vs = (Get-CimInstance MSFT_VSInstance -Namespace root/cimv2/vs).InstallLocation
        "VS_INSTALL=$vs" >> $env:GITHUB_ENV
        "VS_TOOLS=$(Join-Path $vs Common7\Tools)" >> $env:GITHUB_ENV

    - name: Create a build environment
      run: cmake -E make_directory .\build

    - name: Configure CMake
      working-directory: ./build
      run: |
        Import-Module (Join-Path $env:VS_TOOLS Microsoft.VisualStudio.DevShell.dll)
        Enter-VsDevShell `
          -VsInstallPath $env:VS_INSTALL `
          -HostArch amd64 `
          -Arch x86 `
          -SkipAutomaticLocation `
          -DevCmdArguments '-vcvars_ver=14.44'
        cmake .. `
          -G Ninja `
          -D CMAKE_C_COMPILER_LAUNCHER=sccache `
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -D CMAKE_BUILD_TYPE="$env:BUILD_TYPE"

    - name: Build
      working-directory: ./build
      run: |
        Import-Module (Join-Path $env:VS_TOOLS Microsoft.VisualStudio.DevShell.dll)
        Enter-VsDevShell `
          -VsInstallPath $env:VS_INSTALL `
          -HostArch amd64 `
          -Arch x86 `
          -SkipAutomaticLocation `
          -DevCmdArguments '-vcvars_ver=14.44'
        cmake --build . -j $env:NUMBER_OF_PROCESSORS

    - name: Stage artifacts
      run: |
        $out = Join-Path $env:GITHUB_WORKSPACE dist\msvc
        New-Item -ItemType Directory -Force -Path $out | Out-Null

        $want = @(
          'AlpineFaction.dll',
          'AlpineEditor.dll',
          'AlpineFactionLauncher.exe',
          'CrashHandler.exe',
          'd3d8to9.dll',
          'alpinefaction.vpp'
        )

        foreach ($f in $want) {
          $src = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE build) -Recurse -File -Filter $f -ErrorAction SilentlyContinue |
                 Select-Object -First 1

          if (-not $src) {
            Write-Error "Missing $f (not found under build/)"
            Write-Output 'Top-level build dirs:'
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE build) -Directory | Format-Table -AutoSize
            exit 1
          }

          Copy-Item -Force $src.FullName (Join-Path $out $f)
        }

        Write-Output 'Staged:'
        Get-ChildItem $out | Format-Table -AutoSize

    - name: Upload artifacts (MSVC)
      uses: actions/upload-artifact@v6
      with:
        name: alpinefaction-msvc
        path: dist/msvc/**
        if-no-files-found: error
        retention-days: 14
